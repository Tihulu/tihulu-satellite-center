name: Standalone source integrity, deterministic build and package
on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-and-build:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verify inventory and digests
        run: ./build.sh verify
      - name: Python unit tests (removal state gating, vocabulary, wiring)
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          set -euo pipefail
          python3 -m unittest discover -v \
            -s usr/share/tihulu-satellite-center/satellite_center \
            -t usr/share/tihulu-satellite-center \
            -p "test_job_removal.py"
      - name: Deterministic build (run 1)
        run: ./build.sh tar
      - name: Deterministic build (run 2) and byte-compare
        run: |
          set -euo pipefail
          cp dist/installed-package-files.tar.gz /tmp/first.tar.gz
          ./build.sh tar
          sha256sum /tmp/first.tar.gz dist/installed-package-files.tar.gz
          cmp /tmp/first.tar.gz dist/installed-package-files.tar.gz
          echo "deterministic: byte-identical across two builds"

  package-and-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Build deterministic Debian package
        run: ./build_deb.sh build
      - name: Package determinism check
        run: |
          set -euo pipefail
          cp dist/*.deb /tmp/first.deb
          ./build_deb.sh build
          cmp /tmp/first.deb dist/*.deb
          echo "package is byte-identical across two builds"
      - name: Verify package contents and extraction digests
        run: ./build_deb.sh verify
      - name: Extracted-tree smoke (no SDR, no GUI)
        run: |
          set -euo pipefail
          export PYTHONDONTWRITEBYTECODE=1
          export PYTHONPATH="$PWD/.extract/usr/share/tihulu-satellite-center"
          python3 -c "import satellite_center; print('import OK')"
          timeout 60 python3 -m satellite_center doctor > /tmp/doctor.json
          python3 -c "import json;d=json.load(open('/tmp/doctor.json'));assert d['version'].startswith('0.3.0'),d;print('doctor OK', d['version'])"
          test -z "$(find .extract -name '__pycache__' -print -quit)" && echo "no bytecode written into payload"

  interactive-removal-ui:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Ensure a headless browser is available
        run: |
          set -euo pipefail
          if ! command -v chromium-browser >/dev/null 2>&1 && ! command -v chromium >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends chromium-browser
          fi
          command -v chromium-browser || command -v chromium
      - name: Set up Node (the harness uses the built-in WebSocket)
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Node unit tests (removal module + USB diagnostics)
        run: |
          set -euo pipefail
          node --test \
            usr/share/tihulu-satellite-center/satellite_center/browser/job_removal.test.mjs \
            usr/share/tihulu-satellite-center/satellite_center/browser/usb_diagnostics.test.mjs
      - name: "Interactive DOM test: scheduled-job removal (web + native code path)"
        run: node tests/job_removal_cdp.mjs usr/share/tihulu-satellite-center

  interactive-serve-removal-ui:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Ensure a headless browser is available
        run: |
          set -euo pipefail
          if ! command -v chromium-browser >/dev/null 2>&1 && ! command -v chromium >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo DEBIEN_FRONTEND=noninteractive apt-get install -y --no-install-recommends chromium-browser
          fi
          command -v chromium-browser || command -v chromium
      - name: Set up Node (the harness uses the built-in WebSocket)
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: "Interactive DOM test: scheduled-job removal (HTTP serve surface, real Station backend)"
        run: node tests/serve_removal_cdp.mjs usr/share/tihulu-satellite-center

  desktop-removal-surface:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install the Qt desktop runtime the fallback needs
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            python3-pyqt5 python3-numpy
          python3 -c "import PyQt5.QtWidgets; print('PyQt5 OK')"
      - name: "Behavioural test: scheduled-job removal on the Qt fallback (real window, real Station)"
        env:
          SAT_APP_ROOT: "${{ github.workspace }}/usr/share/tihulu-satellite-center"
          PYTHONDONTWRITEBYTECODE: "1"
          QT_QPA_PLATFORM: offscreen
        run: timeout 600 python3 -u tests/test_desktop_removal.py
